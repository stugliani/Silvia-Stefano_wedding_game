<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <!-- Adatta il sito agli smartphone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Colore barra del browser -->
    <meta name="theme-color" content="#111111">

    <title>Ruota della Fortuna Piti Pato</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>La Ruota della Fortuna</h1>

    <div id="domanda"></div>

    <div id="puzzle"></div>

    <div id="keyboard"></div>

    <div id="azioni">
        <button id="risolvi">CONOSCI GLI SPOSI</button>
    </div>

    <!-- Pannello in cui si scrive la soluzione -->
    <div id="tentativo">
        <input type="text" id="rispostaInput" placeholder="Scrivi la frase..."
               autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
        <div id="tentativoBottoni">
            <button id="invia">INVIA</button>
            <button id="annulla">ANNULLA</button>
        </div>
    </div>

    <div id="azione_next">
        <button id="next">Domanda Successiva</button>
    </div>

    <div id="azione_prev">
        <button id="prev">Domanda Precedente</button>
    </div>

    <div id="errore">✕</div>

    <div id="peccato">
        ✕
        <div>AHI AHI AHI</div>
    </div>

    <div id="corretto">CONOSCI GLI SPOSI!</div>

<script src="script.js"></script>
</body>
</html>
